name: Android APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [master, ui/brand-and-services]
  pull_request:
    branches: [master]
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'shared/**'
      - 'assets/**'
      - 'docs/PATIENT_FONTS.md'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_DENTAL_API_URL: https://oralyn-multitenant-staging.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Verify staging-only API target
        run: |
          test "$EXPO_PUBLIC_DENTAL_API_URL" = "https://oralyn-multitenant-staging.onrender.com"
          grep -q "process.env.EXPO_PUBLIC_DENTAL_API_URL" src/api/dentalApi.js

      - name: Test patient navigation, booking contract and licensed fonts
        run: npm test

      - name: Reject vulnerable dependency tree
        run: npm audit --audit-level=low
      - name: TypeScript compiler check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Verify staging JavaScript bundle
        run: npx expo export --platform android

      - name: Require fixed release signing secrets
        env:
          DENTAL_PATIENT_KEYSTORE_BASE64: ${{ secrets.DENTAL_PATIENT_KEYSTORE_BASE64 }}
          DENTAL_PATIENT_KEY_ALIAS: ${{ secrets.DENTAL_PATIENT_KEY_ALIAS }}
          DENTAL_PATIENT_STORE_PASSWORD: ${{ secrets.DENTAL_PATIENT_STORE_PASSWORD }}
          DENTAL_PATIENT_KEY_PASSWORD: ${{ secrets.DENTAL_PATIENT_KEY_PASSWORD }}
        run: |
          missing=0
          for name in DENTAL_PATIENT_KEYSTORE_BASE64 DENTAL_PATIENT_KEY_ALIAS DENTAL_PATIENT_STORE_PASSWORD DENTAL_PATIENT_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Refusing to use debug signing."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Restore fixed release keystore
        env:
          DENTAL_PATIENT_KEYSTORE_BASE64: ${{ secrets.DENTAL_PATIENT_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$DENTAL_PATIENT_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Determine actual release key alias
        env:
          DENTAL_PATIENT_STORE_PASSWORD: ${{ secrets.DENTAL_PATIENT_STORE_PASSWORD }}
        run: |
          alias="$(keytool -list -keystore android/app/release.keystore -storepass "$DENTAL_PATIENT_STORE_PASSWORD" | awk -F, '/PrivateKeyEntry/ {print $1; exit}')"
          if [ -z "$alias" ]; then
            echo "::error::No PrivateKeyEntry found in the patient release keystore."
            exit 1
          fi
          echo "Derived patient release key alias: $alias"
          echo "DENTAL_PATIENT_KEY_ALIAS=$alias" >> "$GITHUB_ENV"

      - name: Configure fixed release signing
        run: |
          cat > android/app/release-signing.gradle <<'EOF'
          android {
            signingConfigs {
              release {
                def ks = System.getenv("DENTAL_PATIENT_KEYSTORE_BASE64")
                def aliasValue = System.getenv("DENTAL_PATIENT_KEY_ALIAS")
                def storePasswordValue = System.getenv("DENTAL_PATIENT_STORE_PASSWORD")
                def keyPasswordValue = System.getenv("DENTAL_PATIENT_KEY_PASSWORD")
                if (!aliasValue || !storePasswordValue || !keyPasswordValue) {
                  throw new GradleException("Fixed release signing secrets are missing; refusing debug signing.")
                }
                storeFile file("release.keystore")
                storePassword storePasswordValue
                keyAlias aliasValue
                keyPassword keyPasswordValue
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF

      - name: Build signed STAGING APK with fixed signing
        working-directory: android
        env:
          DENTAL_PATIENT_STORE_PASSWORD: ${{ secrets.DENTAL_PATIENT_STORE_PASSWORD }}
          DENTAL_PATIENT_KEY_PASSWORD: ${{ secrets.DENTAL_PATIENT_KEY_PASSWORD }}
        run: |
          printf '\napply from: "./release-signing.gradle"\n' >> app/build.gradle
          ./gradlew assembleRelease --no-daemon

      - name: Verify signed STAGING APK
        id: verify_apk
        env:
          DENTAL_PATIENT_STORE_PASSWORD: ${{ secrets.DENTAL_PATIENT_STORE_PASSWORD }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          AAPT="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "::error::Android SDK apksigner not found"; exit 1; }
          test -n "$AAPT" || { echo "::error::Android SDK aapt not found"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/patient-certs.txt
          if grep -qi "Android Debug" /tmp/patient-certs.txt; then
            echo "::error::Release APK is debug-signed. Fixed release signing was not applied."
            exit 1
          fi
          KEYSTORE_CERT="$(keytool -list -v -keystore android/app/release.keystore -storepass "$DENTAL_PATIENT_STORE_PASSWORD" | sed -n 's/.*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          APK_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$KEYSTORE_CERT" || { echo "::error::Could not read the fixed patient keystore certificate fingerprint."; exit 1; }
          test -n "$APK_CERT" || { echo "::error::Could not read the APK signer certificate fingerprint."; exit 1; }
          test "$KEYSTORE_CERT" = "$APK_CERT" || { echo "::error::APK signer does not match the fixed patient release keystore."; exit 1; }
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.drpranali.dental'" || {
            echo "::error::Patient APK package ID does not match com.drpranali.dental."
            exit 1
          }
          unzip -l "$APK" | grep -E 'assets/(index|.*\.bundle)|index.android.bundle' || {
            echo "::error::APK does not contain an embedded JavaScript bundle."
            exit 1
          }
      - name: Export Patient desktop web build
        id: export_web
        if: ${{ always() && steps.verify_apk.outcome == 'success' }}
        run: npx expo export --platform web

      - name: Setup Chrome for desktop screenshot capture
        id: setup_chrome
        if: ${{ always() && steps.export_web.outcome == 'success' }}
        uses: browser-actions/setup-chrome@v1
      - name: Capture Patient desktop screens at laptop widths
        timeout-minutes: 10
        if: ${{ always() && steps.export_web.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -m http.server 19006 --directory dist >/tmp/oralyn-patient-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19006/ >/dev/null; then break; fi
            sleep 1
          done
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::No headless Chrome/Chromium is installed on this runner."
            exit 1
          fi
          export CHROME_BIN
          node scripts/capture-web.cjs

      - name: Upload Patient desktop screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oralyn-patient-desktop-evidence-${{ github.sha }}
          path: build-evidence/patient-web/
          if-no-files-found: warn
          retention-days: 14

      - name: Install and smoke-test Patient APK on Android emulator
        timeout-minutes: 20
        if: ${{ always() && steps.verify_apk.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_SDK_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          test -x "$SDK_ROOT/emulator/emulator"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          if ! timeout 360 "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64" >build-evidence/sdkmanager.log 2>&1; then
            cat build-evidence/sdkmanager.log
            echo "::error::Android SDK package installation failed."
            exit 1
          fi
          printf 'no\n' | "$AVDMANAGER" create avd --force --name oralyn-patient-ci --package "system-images;android-35;google_apis;x86_64" --device pixel_2 --path "$ANDROID_AVD_HOME/oralyn-patient-ci.avd" >build-evidence/avdmanager.log 2>&1
          "$AVDMANAGER" list avd >build-evidence/avdmanager-list.txt 2>&1
          if [ ! -f "$ANDROID_AVD_HOME/oralyn-patient-ci.ini" ]; then
            find "$HOME/.android" "$SDK_ROOT" -maxdepth 6 -name oralyn-patient-ci.ini -print >build-evidence/avd-locations.txt 2>&1 || true
            cat build-evidence/avdmanager.log build-evidence/avdmanager-list.txt
            echo "::error::AVD manager did not create the expected AVD in ANDROID_AVD_HOME."
            exit 1
          fi
          "$SDK_ROOT/emulator/emulator" -list-avds >build-evidence/emulator-list.txt 2>&1
          grep -Fxq "oralyn-patient-ci" build-evidence/emulator-list.txt
          if [ ! -e /dev/kvm ]; then
            echo "::error::Android emulator requires /dev/kvm, but the runner does not expose it."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            ls -l /dev/kvm || true
            echo "::error::Android emulator KVM device is not readable and writable by the runner."
            exit 1
          fi
          ls -l /dev/kvm > build-evidence/kvm-permissions.txt
          "$SDK_ROOT/emulator/emulator" -avd oralyn-patient-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data >build-evidence/emulator.log 2>&1 &
          if ! timeout 240 "$ADB" wait-for-device; then
            "$ADB" devices -l > build-evidence/adb-devices.txt 2>&1 || true
            cat build-evidence/emulator.log || true
            echo "::error::Android emulator did not connect to ADB."
            exit 1
          fi
          boot=""
          for attempt in $(seq 1 60); do
            boot="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$boot" = "1" ] && break
            sleep 5
          done
          if [ "$boot" != "1" ]; then
            cat build-evidence/emulator.log
            echo "::error::Android emulator did not finish booting."
            exit 1
          fi
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          "$ADB" install -r android/app/build/outputs/apk/release/app-release.apk
          "$ADB" logcat -c
          "$ADB" shell monkey -p com.drpranali.dental 1
          sleep 18
          "$ADB" shell uiautomator dump /sdcard/patient-welcome.xml >/dev/null
          "$ADB" pull /sdcard/patient-welcome.xml build-evidence/patient-welcome.xml
          "$ADB" shell screencap -p /sdcard/patient-welcome.png
          "$ADB" pull /sdcard/patient-welcome.png build-evidence/patient-welcome.png
          grep -Fq "Welcome to Oralyn" build-evidence/patient-welcome.xml || {
            echo "::error::Patient welcome/login screen did not render after cold start."
            exit 1
          }
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse('build-evidence/patient-welcome.xml').getroot()
          for node in root.iter('node'):
              if node.attrib.get('text') == 'Explore as a guest':
                  match = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                  if match:
                      x1, y1, x2, y2 = map(int, match.groups())
                      print((x1 + x2) // 2, (y1 + y2) // 2)
                      break
          else:
              raise SystemExit('Explore as a guest button was not accessible in the Android view hierarchy')
          PY
          read -r guest_x guest_y < <(python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse('build-evidence/patient-welcome.xml').getroot()
          for node in root.iter('node'):
              if node.attrib.get('text') == 'Explore as a guest':
                  match = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                  if match:
                      x1, y1, x2, y2 = map(int, match.groups())
                      print((x1 + x2) // 2, (y1 + y2) // 2)
                      break
          else:
              raise SystemExit('Explore as a guest button was not accessible')
          PY
          )
          "$ADB" shell input tap "$guest_x" "$guest_y"
          sleep 4
          "$ADB" shell uiautomator dump /sdcard/patient-home.xml >/dev/null
          "$ADB" pull /sdcard/patient-home.xml build-evidence/patient-home.xml
          "$ADB" shell screencap -p /sdcard/patient-home.png
          "$ADB" pull /sdcard/patient-home.png build-evidence/patient-home.png
          grep -Fq "Book an appointment" build-evidence/patient-home.xml || {
            echo "::error::Patient guest home did not render the booking action."
            exit 1
          }
          python3 - <<'PY' > build-evidence/booking-tap.txt
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse('build-evidence/patient-home.xml').getroot()
          for node in root.iter('node'):
              if node.attrib.get('text') == 'Book an appointment':
                  match = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                  if match:
                      x1, y1, x2, y2 = map(int, match.groups())
                      print((x1 + x2) // 2, (y1 + y2) // 2)
                      break
          else:
              raise SystemExit('Book an appointment button was not accessible')
          PY
          read -r book_x book_y < build-evidence/booking-tap.txt
          "$ADB" shell input tap "$book_x" "$book_y"
          sleep 4
          "$ADB" shell uiautomator dump /sdcard/patient-appointment.xml >/dev/null
          "$ADB" pull /sdcard/patient-appointment.xml build-evidence/patient-appointment.xml
          "$ADB" shell screencap -p /sdcard/patient-appointment.png
          "$ADB" pull /sdcard/patient-appointment.png build-evidence/patient-appointment.png
          for label in "Full name" "Phone number" "Preferred date" "Preferred time" "10:00 AM" "5:00 PM" "8:30 PM"; do
            grep -Fq "$label" build-evidence/patient-appointment.xml || {
              echo "::error::Appointment form is missing expected field or clinic time slot: $label"
              exit 1
            }
          done
          python3 - <<'PY' > build-evidence/time-slot-tap.txt
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse('build-evidence/patient-appointment.xml').getroot()
          for node in root.iter('node'):
              if node.attrib.get('text') == '10:00 AM':
                  match = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                  if match:
                      x1, y1, x2, y2 = map(int, match.groups())
                      print((x1 + x2) // 2, (y1 + y2) // 2)
                      break
          else: raise SystemExit('10:00 AM clinic slot was not accessible')
          PY
          read -r slot_x slot_y < build-evidence/time-slot-tap.txt
          "$ADB" shell input tap "$slot_x" "$slot_y"
          sleep 2
          "$ADB" shell uiautomator dump /sdcard/patient-time-slots.xml >/dev/null
          "$ADB" pull /sdcard/patient-time-slots.xml build-evidence/patient-time-slots.xml
          "$ADB" shell screencap -p /sdcard/patient-time-slots.png
          "$ADB" pull /sdcard/patient-time-slots.png build-evidence/patient-time-slots.png
          python3 - <<'PY' > build-evidence/validation-tap.txt
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse('build-evidence/patient-time-slots.xml').getroot()
          for node in root.iter('node'):
              if node.attrib.get('text') == 'Send appointment request':
                  match = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                  if match:
                      x1, y1, x2, y2 = map(int, match.groups())
                      print((x1 + x2) // 2, (y1 + y2) // 2)
                      break
          else: raise SystemExit('Appointment request action was not accessible')
          PY
          read -r validate_x validate_y < build-evidence/validation-tap.txt
          "$ADB" shell input tap "$validate_x" "$validate_y"
          sleep 2
          "$ADB" shell uiautomator dump /sdcard/patient-validation.xml >/dev/null
          "$ADB" pull /sdcard/patient-validation.xml build-evidence/patient-validation.xml
          grep -Fq "Please enter your name, phone number, preferred date and time." build-evidence/patient-validation.xml || {
            echo "::error::Appointment form did not display its required-field validation state."
            exit 1
          }
          python3 - <<'PY' > build-evidence/home-tab-tap.txt
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse('build-evidence/patient-validation.xml').getroot()
          for node in root.iter('node'):
              if node.attrib.get('text') == 'Home':
                  match = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                  if match:
                      x1, y1, x2, y2 = map(int, match.groups())
                      print((x1 + x2) // 2, (y1 + y2) // 2)
                      break
          else: raise SystemExit('Home navigation tab was not accessible')
          PY
          read -r home_x home_y < build-evidence/home-tab-tap.txt
          "$ADB" shell input tap "$home_x" "$home_y"
          sleep 2
          "$ADB" shell uiautomator dump /sdcard/patient-home-return.xml >/dev/null
          "$ADB" pull /sdcard/patient-home-return.xml build-evidence/patient-home-return.xml
          python3 - <<'PY' > build-evidence/my-care-tap.txt
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse('build-evidence/patient-home-return.xml').getroot()
          for node in root.iter('node'):
              if node.attrib.get('text') == 'View my care and shared records':
                  match = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                  if match:
                      x1, y1, x2, y2 = map(int, match.groups())
                      print((x1 + x2) // 2, (y1 + y2) // 2)
                      break
          else: raise SystemExit('My Care entry point was not accessible from Patient home')
          PY
          read -r care_x care_y < build-evidence/my-care-tap.txt
          "$ADB" shell input tap "$care_x" "$care_y"
          sleep 3
          "$ADB" shell uiautomator dump /sdcard/patient-my-care.xml >/dev/null
          "$ADB" pull /sdcard/patient-my-care.xml build-evidence/patient-my-care.xml
          "$ADB" shell screencap -p /sdcard/patient-my-care.png
          "$ADB" pull /sdcard/patient-my-care.png build-evidence/patient-my-care.png
          grep -Fq "No records shared yet" build-evidence/patient-my-care.xml
          grep -Fq "No invoices shared yet" build-evidence/patient-my-care.xml
          "$ADB" logcat -d -v brief > build-evidence/patient-logcat.txt
          if grep -Ei "FATAL EXCEPTION|No safe area value available|Invariant Violation|Local Inter font load failed" build-evidence/patient-logcat.txt; then
            echo "::error::Fatal Patient Android runtime or local font loading error detected."
            exit 1
          fi
          printf 'commit=%s\nenvironment=staging\napi=https://oralyn-multitenant-staging.onrender.com\npackage=com.drpranali.dental\nfonts=Inter-v20-OFL-1.1\n' "$GITHUB_SHA" > build-evidence/build-info.txt
          if grep -E "FATAL EXCEPTION|No safe area value available|Invariant Violation" build-evidence/patient-logcat.txt; then
            echo "::error::Fatal Patient Android startup or navigation error detected."
            exit 1
          fi
          printf 'commit=%s\nenvironment=staging\napi=https://oralyn-multitenant-staging.onrender.com\npackage=com.drpranali.dental\n' "$GITHUB_SHA" > build-evidence/build-info.txt
          echo "::warning::Patient cold start, guest navigation and booking form verified. OAuth login/session persistence requires a dedicated staging Google test account."

      - name: Upload Patient Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oralyn-patient-android-evidence-${{ github.sha }}
          path: build-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload STAGING APK
        if: ${{ always() && steps.verify_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: dr-pranali-dental-patient-staging-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
