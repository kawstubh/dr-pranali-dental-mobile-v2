name: Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [master, ui/brand-and-services, staging/patient-workspace-test]
  pull_request:
    branches: [master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_DENTAL_API_URL: ${{ github.ref == 'refs/heads/master' && 'https://dr-pranali-dental-api.onrender.com' || 'https://oralyn-multitenant-staging.onrender.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and app identity checks
        run: |
          npx tsc --noEmit
          node -e "const e=require('./app.json').expo; if(e.android.package!=='com.drpranali.dental') throw new Error('Patient Android package ID changed'); if(e.extra?.eas?.projectId!=='7237b92a-a286-4f47-b519-caf145a88d7d') throw new Error('Patient EAS project ID changed');"
          if grep -E 'patientAIChat|explainTreatment|/v1/dental/ai|AI Dental|AI diagnosis' App.js; then
            echo "::error::Patient-facing AI must remain disabled."
            exit 1
          fi

      - name: Verify selected Patient API environment
        run: |
          case "$EXPO_PUBLIC_DENTAL_API_URL" in
            https://oralyn-multitenant-staging.onrender.com|https://dr-pranali-dental-api.onrender.com) ;;
            *) echo "::error::Unexpected Patient API target."; exit 1 ;;
          esac
          echo "Patient API target: $EXPO_PUBLIC_DENTAL_API_URL"

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Verify production JavaScript bundle
        run: npx expo export --platform android

      - name: Require fixed release signing secrets
        env:
          DENTAL_PATIENT_KEYSTORE_BASE64: ${{ secrets.DENTAL_PATIENT_KEYSTORE_BASE64 }}
          DENTAL_PATIENT_KEY_ALIAS: ${{ secrets.DENTAL_PATIENT_KEY_ALIAS }}
          DENTAL_PATIENT_STORE_PASSWORD: ${{ secrets.DENTAL_PATIENT_STORE_PASSWORD }}
          DENTAL_PATIENT_KEY_PASSWORD: ${{ secrets.DENTAL_PATIENT_KEY_PASSWORD }}
        run: |
          missing=0
          for name in DENTAL_PATIENT_KEYSTORE_BASE64 DENTAL_PATIENT_KEY_ALIAS DENTAL_PATIENT_STORE_PASSWORD DENTAL_PATIENT_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Refusing to use debug signing."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Restore fixed release keystore
        env:
          DENTAL_PATIENT_KEYSTORE_BASE64: ${{ secrets.DENTAL_PATIENT_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$DENTAL_PATIENT_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Determine actual release key alias
        env:
          DENTAL_PATIENT_STORE_PASSWORD: ${{ secrets.DENTAL_PATIENT_STORE_PASSWORD }}
        run: |
          alias="$(keytool -list -keystore android/app/release.keystore -storepass "$DENTAL_PATIENT_STORE_PASSWORD" | awk -F, '/PrivateKeyEntry/ {print $1; exit}')"
          if [ -z "$alias" ]; then
            echo "::error::No PrivateKeyEntry found in the patient release keystore."
            exit 1
          fi
          echo "Derived patient release key alias: $alias"
          echo "DENTAL_PATIENT_KEY_ALIAS=$alias" >> "$GITHUB_ENV"

      - name: Configure fixed release signing
        run: |
          cat > android/app/release-signing.gradle <<'EOF'
          android {
            signingConfigs {
              release {
                def ks = System.getenv("DENTAL_PATIENT_KEYSTORE_BASE64")
                def aliasValue = System.getenv("DENTAL_PATIENT_KEY_ALIAS")
                def storePasswordValue = System.getenv("DENTAL_PATIENT_STORE_PASSWORD")
                def keyPasswordValue = System.getenv("DENTAL_PATIENT_KEY_PASSWORD")
                if (!aliasValue || !storePasswordValue || !keyPasswordValue) {
                  throw new GradleException("Fixed release signing secrets are missing; refusing debug signing.")
                }
                storeFile file("release.keystore")
                storePassword storePasswordValue
                keyAlias aliasValue
                keyPassword keyPasswordValue
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF

      - name: Build RELEASE APK with fixed signing
        working-directory: android
        env:
          DENTAL_PATIENT_STORE_PASSWORD: ${{ secrets.DENTAL_PATIENT_STORE_PASSWORD }}
          DENTAL_PATIENT_KEY_PASSWORD: ${{ secrets.DENTAL_PATIENT_KEY_PASSWORD }}
        run: |
          printf '\napply from: "./release-signing.gradle"\n' >> app/build.gradle
          ./gradlew assembleRelease --no-daemon

      - name: Verify package, fixed signing certificate, and embedded bundle
        env:
          DENTAL_PATIENT_STORE_PASSWORD: ${{ secrets.DENTAL_PATIENT_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
          test -x "$APKSIGNER" || { echo "::error::Android SDK apksigner not found"; exit 1; }
          test -x "$AAPT" || { echo "::error::Android SDK aapt not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/patient-certs.txt
          APK_CERT=$(awk -F': ' '/certificate SHA-256 digest:/{gsub(/:/,"",$NF); print toupper($NF); exit}' /tmp/patient-certs.txt)
          KEYSTORE_CERT="$(keytool -list -v -keystore android/app/release.keystore -alias "$DENTAL_PATIENT_KEY_ALIAS" -storepass "$DENTAL_PATIENT_STORE_PASSWORD" | sed -nE 's/.*SHA256: ([0-9A-Fa-f:]+).*/\1/p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$APK_CERT" || { echo "::error::APK signer SHA-256 fingerprint missing"; exit 1; }
          test -n "$KEYSTORE_CERT" || { echo "::error::Release keystore SHA-256 fingerprint missing"; exit 1; }
          test "$APK_CERT" = "$KEYSTORE_CERT" || { echo "::error::APK signer does not match the fixed Patient release keystore"; exit 1; }
          PACKAGE_ID="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$PACKAGE_ID" = "com.drpranali.dental" || { echo "::error::Unexpected Patient package ID: $PACKAGE_ID"; exit 1; }
          unzip -l "$APK" | grep -q 'assets/index.android.bundle' || {
            echo "::error::APK does not contain an embedded JavaScript bundle."
            exit 1
          }
          echo "Verified package=$PACKAGE_ID signer_sha256=$APK_CERT API=$EXPO_PUBLIC_DENTAL_API_URL"
      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-pranali-dental-patient-${{ github.ref == 'refs/heads/master' && 'release-apk' || 'staging-test-apk' }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish patient-latest GitHub Release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if gh release view patient-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload patient-latest "$APK#dr-pranali-patient.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create patient-latest "$APK#dr-pranali-patient.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Patient APK latest" --notes "Latest signed patient Android APK." --latest=false
          fi
