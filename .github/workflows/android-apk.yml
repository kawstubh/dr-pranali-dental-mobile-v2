name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Verify production JavaScript bundle
        run: npx expo export --platform android

      - name: Build RELEASE APK with embedded bundle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK contains embedded React Native bundle
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/(index|.*\.bundle)|index.android.bundle' || {
            echo "ERROR: APK does not contain an embedded JavaScript bundle."
            exit 1
          }

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-pranali-dental-patient-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
