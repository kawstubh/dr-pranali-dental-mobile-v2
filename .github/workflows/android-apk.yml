name: Android APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [master, ui/brand-and-services]
  pull_request:
    branches: [master]
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'shared/**'
      - 'assets/**'
      - 'docs/PATIENT_FONTS.md'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_DENTAL_API_URL: https://oralyn-multitenant-staging.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Verify staging-only API target
        run: |
          test "$EXPO_PUBLIC_DENTAL_API_URL" = "https://oralyn-multitenant-staging.onrender.com"
          grep -q "process.env.EXPO_PUBLIC_DENTAL_API_URL" src/api/dentalApi.js

      - name: Test patient navigation, booking contract and licensed fonts
        run: npm test

      - name: Reject vulnerable dependency tree
        run: npm audit --audit-level=low
      - name: TypeScript compiler check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Verify production JavaScript bundle
        run: npx expo export --platform android

      - name: Require fixed release signing secrets
        env:
          DENTAL_PATIENT_KEYSTORE_BASE64: ${{ secrets.DENTAL_PATIENT_KEYSTORE_BASE64 }}
          DENTAL_PATIENT_KEY_ALIAS: ${{ secrets.DENTAL_PATIENT_KEY_ALIAS }}
          DENTAL_PATIENT_STORE_PASSWORD: ${{ secrets.DENTAL_PATIENT_STORE_PASSWORD }}
          DENTAL_PATIENT_KEY_PASSWORD: ${{ secrets.DENTAL_PATIENT_KEY_PASSWORD }}
        run: |
          missing=0
          for name in DENTAL_PATIENT_KEYSTORE_BASE64 DENTAL_PATIENT_KEY_ALIAS DENTAL_PATIENT_STORE_PASSWORD DENTAL_PATIENT_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Refusing to use debug signing."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Restore fixed release keystore
        env:
          DENTAL_PATIENT_KEYSTORE_BASE64: ${{ secrets.DENTAL_PATIENT_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$DENTAL_PATIENT_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Determine actual release key alias
        env:
          DENTAL_PATIENT_STORE_PASSWORD: ${{ secrets.DENTAL_PATIENT_STORE_PASSWORD }}
        run: |
          alias="$(keytool -list -keystore android/app/release.keystore -storepass "$DENTAL_PATIENT_STORE_PASSWORD" | awk -F, '/PrivateKeyEntry/ {print $1; exit}')"
          if [ -z "$alias" ]; then
            echo "::error::No PrivateKeyEntry found in the patient release keystore."
            exit 1
          fi
          echo "Derived patient release key alias: $alias"
          echo "DENTAL_PATIENT_KEY_ALIAS=$alias" >> "$GITHUB_ENV"

      - name: Configure fixed release signing
        run: |
          cat > android/app/release-signing.gradle <<'EOF'
          android {
            signingConfigs {
              release {
                def ks = System.getenv("DENTAL_PATIENT_KEYSTORE_BASE64")
                def aliasValue = System.getenv("DENTAL_PATIENT_KEY_ALIAS")
                def storePasswordValue = System.getenv("DENTAL_PATIENT_STORE_PASSWORD")
                def keyPasswordValue = System.getenv("DENTAL_PATIENT_KEY_PASSWORD")
                if (!aliasValue || !storePasswordValue || !keyPasswordValue) {
                  throw new GradleException("Fixed release signing secrets are missing; refusing debug signing.")
                }
                storeFile file("release.keystore")
                storePassword storePasswordValue
                keyAlias aliasValue
                keyPassword keyPasswordValue
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF

      - name: Build signed STAGING APK with fixed signing
        working-directory: android
        env:
          DENTAL_PATIENT_STORE_PASSWORD: ${{ secrets.DENTAL_PATIENT_STORE_PASSWORD }}
          DENTAL_PATIENT_KEY_PASSWORD: ${{ secrets.DENTAL_PATIENT_KEY_PASSWORD }}
        run: |
          printf '\napply from: "./release-signing.gradle"\n' >> app/build.gradle
          ./gradlew assembleRelease --no-daemon

      - name: Verify signed STAGING APK
        env:
          DENTAL_PATIENT_STORE_PASSWORD: ${{ secrets.DENTAL_PATIENT_STORE_PASSWORD }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          AAPT="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "::error::Android SDK apksigner not found"; exit 1; }
          test -n "$AAPT" || { echo "::error::Android SDK aapt not found"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/patient-certs.txt
          if grep -qi "Android Debug" /tmp/patient-certs.txt; then
            echo "::error::Release APK is debug-signed. Fixed release signing was not applied."
            exit 1
          fi
          KEYSTORE_CERT="$(keytool -list -v -keystore android/app/release.keystore -storepass "$DENTAL_PATIENT_STORE_PASSWORD" | sed -n 's/.*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          APK_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$KEYSTORE_CERT" || { echo "::error::Could not read the fixed patient keystore certificate fingerprint."; exit 1; }
          test -n "$APK_CERT" || { echo "::error::Could not read the APK signer certificate fingerprint."; exit 1; }
          test "$KEYSTORE_CERT" = "$APK_CERT" || { echo "::error::APK signer does not match the fixed patient release keystore."; exit 1; }
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.drpranali.dental'" || {
            echo "::error::Patient APK package ID does not match com.drpranali.dental."
            exit 1
          }
          unzip -l "$APK" | grep -E 'assets/(index|.*\.bundle)|index.android.bundle' || {
            echo "::error::APK does not contain an embedded JavaScript bundle."
            exit 1
          }
      - name: Upload STAGING APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-pranali-dental-patient-staging-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
