name: Doctor Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-doctor-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: doctor-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doctor-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Verify production JavaScript bundle
        run: npx expo export --platform android

      - name: Build RELEASE APK
        working-directory: doctor-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify RELEASE APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo "Release APK verified: $(du -h "$APK" | cut -f1)"
          unzip -l "$APK" | grep -E 'AndroidManifest.xml|index\.android\.bundle|\.hbc|_expo/static/js' | head -20 || true

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-pranali-dental-doctor-release-apk
          path: doctor-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
