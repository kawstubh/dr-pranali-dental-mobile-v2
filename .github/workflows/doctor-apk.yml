name: Doctor Android APK

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'doctor-app/**'
      - '.github/workflows/doctor-apk.yml'
  push:
    branches: [master]

jobs:
  build-doctor-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_DENTAL_API_URL: https://oralyn-multitenant-staging.onrender.com
    defaults:
      run:
        working-directory: doctor-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doctor-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo SDK native package compatibility
        run: |
          npx expo install --check
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const versions = Object.entries(lock.packages || {})
            .filter(([path]) => path.endsWith('node_modules/expo-font'))
            .map(([, entry]) => entry.version);
          if (!versions.length || versions.some(version => version.split('.')[0] !== '57')) {
            console.error('Expo SDK 57 requires expo-font 57.x; resolved versions:', versions);
            process.exit(1);
          }
          console.log('Compatible expo-font versions:', versions.join(', '));
          NODE

      - name: Reject vulnerable dependency tree
        run: npm audit --audit-level=low

      - name: Enforce clinic password-only Doctor authentication
        run: |
          test -f src/auth/passwordAuth.js
          test ! -e src/auth/googleAuth.js
          set +e
          grep -R -n -E 'GoogleSignin|signInWithGoogle|/v1/dental/auth/google|googleAuth|google_code|google_status|@react-native-google-signin/google-signin|@supabase/supabase-js|react-native-url-polyfill|signInWithOtp|sendSmsOtp|verifySmsOtp|/v1/dental/auth/(sms|otp)|@twilio/|/v1/dental/auth/(register|signup)|publicSignUp' App.js src/auth src/api app.json package.json
          grep_status=$?
          set -e
          if [ "$grep_status" -eq 0 ]; then
            echo "::error::Doctor app must use clinic email/password authentication only."
            exit 1
          elif [ "$grep_status" -gt 1 ]; then
            echo "::error::Could not complete the recursive Doctor authentication source scan (grep exit $grep_status)."
            exit "$grep_status"
          fi
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if (JSON.stringify(p.dependencies)!==JSON.stringify(l.packages[''].dependencies)) { console.error('package.json and package-lock root dependencies differ'); process.exit(1); }"

      - name: Run workspace-state tests
        run: npm test

      - name: TypeScript compiler check
        run: npx tsc --noEmit

      - name: Verify selected API environment
        run: |
          case "$EXPO_PUBLIC_DENTAL_API_URL" in
            https://oralyn-multitenant-staging.onrender.com) ;;
            *) echo "::error::Unexpected Doctor API target."; exit 1 ;;
          esac
          echo "Doctor API target: $EXPO_PUBLIC_DENTAL_API_URL"

      - name: Verify password login uses the selected API target
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('App.js', 'utf8');
          const match = source.match(/signInWithPassword\(\s*([^,]+)/);
          if (!match || match[1].trim() !== 'DOCTOR_API_URL') {
            console.error('Doctor password login must use DOCTOR_API_URL, not a hard-coded host.');
            process.exit(1);
          }
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Verify staging JavaScript bundle
        run: npx expo export --platform android

      - name: Require fixed release signing secrets
        env:
          DENTAL_DOCTOR_KEYSTORE_BASE64: ${{ secrets.DENTAL_DOCTOR_KEYSTORE_BASE64 }}
          DENTAL_DOCTOR_KEY_ALIAS: ${{ secrets.DENTAL_DOCTOR_KEY_ALIAS }}
          DENTAL_DOCTOR_STORE_PASSWORD: ${{ secrets.DENTAL_DOCTOR_STORE_PASSWORD }}
          DENTAL_DOCTOR_KEY_PASSWORD: ${{ secrets.DENTAL_DOCTOR_KEY_PASSWORD }}
        run: |
          missing=0
          for name in DENTAL_DOCTOR_KEYSTORE_BASE64 DENTAL_DOCTOR_KEY_ALIAS DENTAL_DOCTOR_STORE_PASSWORD DENTAL_DOCTOR_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Refusing to use debug signing."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Restore fixed release keystore
        env:
          DENTAL_DOCTOR_KEYSTORE_BASE64: ${{ secrets.DENTAL_DOCTOR_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$DENTAL_DOCTOR_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Determine actual release key alias
        env:
          DENTAL_DOCTOR_STORE_PASSWORD: ${{ secrets.DENTAL_DOCTOR_STORE_PASSWORD }}
        run: |
          alias="$(keytool -list -keystore android/app/release.keystore -storepass "$DENTAL_DOCTOR_STORE_PASSWORD" | awk -F, '/PrivateKeyEntry/ {print $1; exit}')"
          if [ -z "$alias" ]; then
            echo "::error::No PrivateKeyEntry found in the doctor release keystore."
            exit 1
          fi
          echo "Derived doctor release key alias: $alias"
          echo "DENTAL_DOCTOR_KEY_ALIAS=$alias" >> "$GITHUB_ENV"

      - name: Configure fixed release signing
        run: |
          cat > android/app/release-signing.gradle <<'EOF'
          android {
            signingConfigs {
              release {
                def aliasValue = System.getenv("DENTAL_DOCTOR_KEY_ALIAS")
                def storePasswordValue = System.getenv("DENTAL_DOCTOR_STORE_PASSWORD")
                def keyPasswordValue = System.getenv("DENTAL_DOCTOR_KEY_PASSWORD")
                if (!aliasValue || !storePasswordValue || !keyPasswordValue) {
                  throw new GradleException("Fixed release signing secrets are missing; refusing debug signing.")
                }
                storeFile file("release.keystore")
                storePassword storePasswordValue
                keyAlias aliasValue
                keyPassword keyPasswordValue
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF

      - name: Build signed STAGING APK with fixed signing
        working-directory: doctor-app/android
        env:
          DENTAL_DOCTOR_STORE_PASSWORD: ${{ secrets.DENTAL_DOCTOR_STORE_PASSWORD }}
          DENTAL_DOCTOR_KEY_PASSWORD: ${{ secrets.DENTAL_DOCTOR_KEY_PASSWORD }}
        run: |
          printf '\napply from: "./release-signing.gradle"\n' >> app/build.gradle
          ./gradlew assembleRelease --no-daemon

      - name: Verify signed STAGING APK
        id: verify_apk
        env:
          DENTAL_DOCTOR_STORE_PASSWORD: ${{ secrets.DENTAL_DOCTOR_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::Android SDK apksigner was not found; refusing to mark this APK verified."
            exit 1
          fi
          AAPT="$(dirname "$APKSIGNER")/aapt"
          if [ ! -x "$AAPT" ]; then
            echo "::error::Android SDK aapt was not found alongside apksigner."
            exit 1
          fi

          # Capture both output streams so verification failures are diagnosable in Actions logs.
          set +e
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/doctor-certs.txt 2>&1
          APKSIGNER_STATUS=$?
          set -e
          cat /tmp/doctor-certs.txt
          if [ "$APKSIGNER_STATUS" -ne 0 ]; then
            echo "::error::apksigner rejected the built Doctor APK (exit $APKSIGNER_STATUS)."
            exit 1
          fi
          if grep -qi "Android Debug" /tmp/doctor-certs.txt; then
            echo "::error::Release APK is debug-signed. Fixed release signing was not applied."
            exit 1
          fi

          if ! keytool -list -v -keystore android/app/release.keystore -alias "$DENTAL_DOCTOR_KEY_ALIAS" -storepass "$DENTAL_DOCTOR_STORE_PASSWORD" > /tmp/doctor-keystore.txt 2>&1; then
            cat /tmp/doctor-keystore.txt
            echo "::error::Could not read the fixed Doctor release keystore alias for certificate comparison."
            exit 1
          fi
          EXPECTED_CERT="$(awk -F': ' '/SHA256:/{print $NF; exit}' /tmp/doctor-keystore.txt | tr -d ': \r\n' | tr '[:upper:]' '[:lower:]')"
          # apksigner output differs by build-tools version (e.g. "V2 Signer: certificate SHA-256 digest").
          ACTUAL_CERT="$(awk -F': ' '/certificate SHA-256 digest:/{print $NF; exit}' /tmp/doctor-certs.txt | tr -d ': \r\n' | tr '[:upper:]' '[:lower:]')"
          echo "Fixed release keystore SHA-256: $EXPECTED_CERT"
          echo "APK signer SHA-256: $ACTUAL_CERT"
          if [ -z "$EXPECTED_CERT" ] || [ -z "$ACTUAL_CERT" ] || [ "$EXPECTED_CERT" != "$ACTUAL_CERT" ]; then
            echo "::error::APK signer certificate does not match the fixed Doctor release keystore."
            exit 1
          fi

          PACKAGE_NAME="$("$AAPT" dump badging "$APK" | grep -m1 -o "package: name='[^']*'" | cut -d"'" -f2)"
          if [ "$PACKAGE_NAME" != "com.drpranali.dental.doctor" ]; then
            echo "::error::Unexpected Doctor APK package ID: $PACKAGE_NAME"
            exit 1
          fi
          unzip -l "$APK" | grep -Eq 'assets/index[.]android[.]bundle([.]hbc)?'
          echo "Verified Doctor APK package and release certificate: $PACKAGE_NAME"
      - name: Export Doctor desktop web build
        id: export_web
        if: ${{ always() && steps.verify_apk.outcome == 'success' }}
        run: npx expo export --platform web

      - name: Capture Doctor desktop screens at laptop widths
        if: ${{ always() && steps.export_web.outcome == 'success' }}
        env:
          DENTAL_STAGING_DOCTOR_EMAIL: ${{ secrets.DENTAL_STAGING_DOCTOR_EMAIL }}
          DENTAL_STAGING_DOCTOR_PASSWORD: ${{ secrets.DENTAL_STAGING_DOCTOR_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -m http.server 19007 --directory dist >/tmp/oralyn-doctor-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19007/ >/dev/null; then break; fi
            sleep 1
          done
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::No headless Chrome/Chromium is installed on this runner."
            exit 1
          fi
          export CHROME_BIN
          node scripts/capture-web.cjs

      - name: Upload Doctor desktop screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oralyn-doctor-desktop-evidence-${{ github.sha }}
          path: doctor-app/build-evidence/doctor-web/
          if-no-files-found: warn
          retention-days: 14

      - name: Install and smoke-test Doctor APK on Android emulator
        if: ${{ always() && steps.verify_apk.outcome == 'success' }}
        env:
          DENTAL_STAGING_DOCTOR_EMAIL: ${{ secrets.DENTAL_STAGING_DOCTOR_EMAIL }}
          DENTAL_STAGING_DOCTOR_PASSWORD: ${{ secrets.DENTAL_STAGING_DOCTOR_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          SDK_ROOT="\${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_SDK_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          if ! timeout 360 "$SDKMANAGER" --install "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64" >build-evidence/sdkmanager.log 2>&1; then
            cat build-evidence/sdkmanager.log
            echo "::error::Android SDK package installation failed."
            exit 1
          fi
          "$SDKMANAGER" --list_installed >build-evidence/sdkmanager-installed.txt 2>&1
          grep -Fq "system-images;android-35;google_apis;x86_64" build-evidence/sdkmanager-installed.txt || {
            cat build-evidence/sdkmanager-installed.txt
            echo "::error::Android 35 Google APIs system image was not installed."
            exit 1
          }
          if ! printf 'no\n' | "$AVDMANAGER" create avd --force --name oralyn-doctor-ci --package "system-images;android-35;google_apis;x86_64" --device pixel_2 >build-evidence/avdmanager.log 2>&1; then
            cat build-evidence/avdmanager.log
            echo "::error::Android virtual device creation failed."
            exit 1
          fi
          "$AVDMANAGER" list avd >build-evidence/avdmanager-list.txt 2>&1
          if [ ! -f "$ANDROID_AVD_HOME/oralyn-doctor-ci.ini" ]; then
            find "$HOME/.android" "$SDK_ROOT" -maxdepth 6 -name oralyn-doctor-ci.ini -print >build-evidence/avd-locations.txt 2>&1 || true
            cat build-evidence/avdmanager.log
            cat build-evidence/avdmanager-list.txt
            echo "::error::AVD manager did not create the expected AVD in ANDROID_AVD_HOME."
            exit 1
          fi
          test -x "$SDK_ROOT/emulator/emulator"
          "$ADB" start-server
          "$SDK_ROOT/emulator/emulator" -avd oralyn-doctor-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data >build-evidence/emulator.log 2>&1 &
          timeout 240 "$ADB" wait-for-device
          boot=""
          for attempt in $(seq 1 90); do
            boot="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$boot" = "1" ] && break
            sleep 2
          done
          if [ "$boot" != "1" ]; then
            cat build-evidence/emulator.log
            echo "::error::Android emulator did not finish booting."
            exit 1
          fi
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          "$ADB" install -r android/app/build/outputs/apk/release/app-release.apk
          "$ADB" logcat -c
          "$ADB" shell monkey -p com.drpranali.dental.doctor 1
          sleep 20
          timeout 30 "$ADB" shell uiautomator dump /sdcard/doctor-window.xml >/dev/null
          "$ADB" pull /sdcard/doctor-window.xml build-evidence/doctor-window.xml
          "$ADB" shell screencap -p /sdcard/doctor-login.png
          "$ADB" pull /sdcard/doctor-login.png build-evidence/doctor-login.png
          "$ADB" logcat -d -v brief >build-evidence/doctor-logcat.txt
          "$ADB" shell dumpsys activity activities >build-evidence/doctor-activities.txt
          grep -Fq "Sign in with your clinic-issued email and password." build-evidence/doctor-window.xml || {
            echo "::error::Doctor login UI did not render after cold start; inspect screenshot and logcat."
            exit 1
          }
          if grep -E "FATAL EXCEPTION|No safe area value available|Invariant Violation|ReactNativeJS.*(Error|TypeError)" build-evidence/doctor-logcat.txt; then
            echo "::error::Fatal Android or React Native startup error detected."
            exit 1
          fi
          printf 'commit=%s\nenvironment=staging\napi=https://oralyn-multitenant-staging.onrender.com\npackage=com.drpranali.dental.doctor\n' "$GITHUB_SHA" >build-evidence/build-info.txt
          if [ -z "$DENTAL_STAGING_DOCTOR_EMAIL" ] || [ -z "$DENTAL_STAGING_DOCTOR_PASSWORD" ]; then
            echo "::warning::Cold start and login screen can be verified. Authenticated dashboard, empty-account and session-persistence checks still require DENTAL_STAGING_DOCTOR_EMAIL and DENTAL_STAGING_DOCTOR_PASSWORD GitHub secrets."
          fi

      - name: Upload Doctor Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oralyn-doctor-android-evidence-${{ github.sha }}
          path: doctor-app/build-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload STAGING APK
        if: ${{ always() && steps.verify_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: dr-pranali-dental-doctor-staging-apk
          path: doctor-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
