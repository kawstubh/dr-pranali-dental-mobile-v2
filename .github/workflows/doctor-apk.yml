name: Doctor Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-doctor-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: doctor-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doctor-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compiler check
        run: npx tsc --noEmit --allowJs --checkJs false --skipLibCheck --moduleResolution bundler --module esnext --target es2022 --jsx react-native App.js

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Verify production JavaScript bundle
        run: npx expo export --platform android

      - name: Require fixed release signing secrets
        env:
          DENTAL_DOCTOR_KEYSTORE_BASE64: ${{ secrets.DENTAL_DOCTOR_KEYSTORE_BASE64 }}
          DENTAL_DOCTOR_KEY_ALIAS: ${{ secrets.DENTAL_DOCTOR_KEY_ALIAS }}
          DENTAL_DOCTOR_STORE_PASSWORD: ${{ secrets.DENTAL_DOCTOR_STORE_PASSWORD }}
          DENTAL_DOCTOR_KEY_PASSWORD: ${{ secrets.DENTAL_DOCTOR_KEY_PASSWORD }}
        run: |
          missing=0
          for name in DENTAL_DOCTOR_KEYSTORE_BASE64 DENTAL_DOCTOR_KEY_ALIAS DENTAL_DOCTOR_STORE_PASSWORD DENTAL_DOCTOR_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Refusing to use debug signing."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Restore fixed release keystore
        env:
          DENTAL_DOCTOR_KEYSTORE_BASE64: ${{ secrets.DENTAL_DOCTOR_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$DENTAL_DOCTOR_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Configure fixed release signing
        run: |
          cat > android/app/release-signing.gradle <<'EOF'
          android {
            signingConfigs {
              release {
                def alias = System.getenv("DENTAL_DOCTOR_KEY_ALIAS")
                def storePassword = System.getenv("DENTAL_DOCTOR_STORE_PASSWORD")
                def keyPassword = System.getenv("DENTAL_DOCTOR_KEY_PASSWORD")
                if (!alias || !storePassword || !keyPassword) {
                  throw new GradleException("Fixed release signing secrets are missing; refusing debug signing.")
                }
                storeFile file("release.keystore")
                storePassword storePassword
                keyAlias alias
                keyPassword keyPassword
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF

      - name: Build RELEASE APK with fixed signing
        working-directory: android
        env:
          DENTAL_DOCTOR_KEY_ALIAS: ${{ secrets.DENTAL_DOCTOR_KEY_ALIAS }}
          DENTAL_DOCTOR_STORE_PASSWORD: ${{ secrets.DENTAL_DOCTOR_STORE_PASSWORD }}
          DENTAL_DOCTOR_KEY_PASSWORD: ${{ secrets.DENTAL_DOCTOR_KEY_PASSWORD }}
        run: |
          printf '\napply from: "./release-signing.gradle"\n' >> app/build.gradle
          ./gradlew assembleRelease --no-daemon

      - name: Verify signed RELEASE APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          apksigner verify --print-certs "$APK" | tee /tmp/doctor-certs.txt
          if grep -qi "Android Debug" /tmp/doctor-certs.txt; then
            echo "::error::Release APK is debug-signed. Fixed release signing was not applied."
            exit 1
          fi
          unzip -l "$APK" | grep -E 'AndroidManifest.xml|index\.android\.bundle|\.hbc|_expo/static/js' | head -20 || true

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-pranali-dental-doctor-release-apk
          path: doctor-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
