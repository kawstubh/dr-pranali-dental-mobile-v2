name: Generate and commit brand PNG assets
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev
          python -m pip install --upgrade pip cairosvg pillow
      - name: Generate all PNG icon variants
        run: python scripts/generate_brand_assets.py
      - name: Commit generated PNGs to the PR branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doctor-app/assets/dr-pranali-branded-logo.png assets/patient-icon.png assets/patient-adaptive-foreground.png assets/patient-splash.png assets/patient-favicon.png assets/patient-monochrome.png assets/patient-notification.png doctor-app/assets/doctor-icon.png doctor-app/assets/doctor-adaptive-foreground.png doctor-app/assets/doctor-splash.png doctor-app/assets/doctor-favicon.png doctor-app/assets/doctor-monochrome.png doctor-app/assets/doctor-notification.png
          if git diff --cached --quiet; then
            echo "Generated PNG assets are already up to date."
            exit 0
          fi
          git commit -m "Add generated Patient and Doctor brand PNG assets"
          git push origin "HEAD:$TARGET_BRANCH"
