name: One-off Doctor notification dependency
on:
  push:
    branches: [ui/brand-and-services]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/brand-and-services
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install SDK-compatible Doctor notifications package
        working-directory: doctor-app
        run: |
          npm ci
          npx expo install expo-notifications
      - name: Commit Doctor manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doctor-app/package.json doctor-app/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Expo notifications dependency to Doctor app"
          git push origin HEAD:ui/brand-and-services
