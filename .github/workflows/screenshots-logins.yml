name: Login UI screenshot proof

on:
  push:
    branches: [ui/full-redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots-logins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Patient dependencies and web renderer
        run: |
          npm ci
          npx expo install react-dom react-native-web
      - name: Export Patient app for web
        run: npx expo export --platform web --output-dir dist-patient
      - name: Install Doctor dependencies and web renderer
        working-directory: doctor-app
        run: |
          npm ci
          npx expo install react-dom react-native-web
      - name: Export Doctor app for web
        working-directory: doctor-app
        run: npx expo export --platform web --output-dir dist-doctor
      - name: Install Playwright
        run: |
          npm install --no-save playwright http-server
          npx playwright install --with-deps chromium
      - name: Capture Patient and Doctor login screens at 390x844
        run: |
          mkdir -p screenshots-logins
          npx http-server dist-patient -p 4173 -s > /tmp/patient-server.log 2>&1 &
          PATIENT_PID=$!
          npx http-server doctor-app/dist-doctor -p 4174 -s > /tmp/doctor-server.log 2>&1 &
          DOCTOR_PID=$!
          trap 'kill $PATIENT_PID $DOCTOR_PID 2>/dev/null || true' EXIT
          cat > capture-logins.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
            const cases = [
              { name: 'patient-login', url: 'http://127.0.0.1:4173', expected: 'Welcome' },
              { name: 'doctor-login', url: 'http://127.0.0.1:4174', expected: 'Doctor Login' },
            ];
            for (const item of cases) {
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', error => errors.push('pageerror: ' + error.message));
              page.on('console', msg => { if (msg.type() === 'error') errors.push('console: ' + msg.text()); });
              page.on('requestfailed', request => errors.push('requestfailed: ' + request.url() + ' ' + request.failure()?.errorText));
              await page.goto(item.url, { waitUntil: 'domcontentloaded', timeout: 90000 });
              try {
                await page.waitForFunction(needle => document.body.innerText.includes(needle), item.expected, { timeout: 20000 });
              } catch (error) {
                console.error(item.name + ' failed to render expected text: ' + item.expected);
                console.error('body=' + (await page.locator('body').innerText().catch(() => 'unavailable')));
                console.error(errors.join('\n'));
                throw error;
              }
              await page.screenshot({ path: 'screenshots-logins/' + item.name + '.png', fullPage: true });
              console.log(item.name + ': rendered ' + item.expected + '; viewport=390x844');
              if (errors.length) console.log(item.name + ' browser diagnostics:\n' + errors.join('\n'));
              await page.close();
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          EOF
          node capture-logins.cjs
      - name: Upload screenshot proof
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-logins
          path: screenshots-logins/*.png
          if-no-files-found: error
          retention-days: 14
