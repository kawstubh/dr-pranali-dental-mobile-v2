name: UI validation (Patient + Doctor)
on:
  pull_request:
    branches: [master]
  push:
    branches: [ui/brand-and-services]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            doctor-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pillow
      - run: python scripts/audit_images.py
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform android
      - run: npm ci
        working-directory: doctor-app
      - run: npx tsc --noEmit
        working-directory: doctor-app
      - run: npx expo export --platform android
        working-directory: doctor-app
