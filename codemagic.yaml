workflows:
  android-debug:
    name: Dr. Pranali Dental Patient Android APK
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      node: v22.11.0
      vars:
        JAVA_TOOL_OPTIONS: "-Xmx5g"
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Generate Android project
        script: npx expo prebuild --platform android --non-interactive
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Prepare Gradle wrapper
        script: chmod +x "$CM_BUILD_DIR/android/gradlew"
      - name: Build debug APK
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
