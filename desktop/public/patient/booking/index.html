<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0C3B82">
<meta name="oralyn-api-origin" content="__ORALYN_API_ORIGIN__">
<link rel="icon" type="image/webp" href="/oralyn-app-icon-approved.webp">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/oralyn-pwa-192.png">
<title>Request an appointment | Dr Pranali Dental Clinic</title>
<style>
@font-face{font-family:'Plus Jakarta Sans';src:url('/fonts/PlusJakartaSans-Variable.ttf') format('truetype');font-style:normal;font-weight:200 800;font-display:swap}
@font-face{font-family:'Playfair Display';src:url('/fonts/PlayfairDisplay-Variable.ttf') format('truetype');font-style:normal;font-weight:400 900;font-display:swap}
:root{font-family:'Plus Jakarta Sans',Arial,sans-serif;color:#12304a;background:#f4fbff}
*{box-sizing:border-box}
html{min-height:100%;background:#f4fbff}
body{margin:0;min-height:100vh}
header{height:104px;background:#fff;border-bottom:1px solid #e2edf4;padding:0 max(20px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
header img{width:112px;max-width:42vw;max-height:100%;height:auto;display:block;object-fit:contain}
a{color:#0a84e8}
.pill{border:1px solid #cce8ee;border-radius:30px;padding:8px 14px;color:#0b7280;text-decoration:none;font-size:13px;font-weight:750;white-space:nowrap}
.wrap{width:min(100% - 32px,680px);margin:24px auto 32px}
.panel{background:#fff;border:1px solid #e0ebf2;border-radius:20px;padding:24px 28px;box-shadow:0 14px 40px rgba(12,59,130,.06)}
.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#078c98;font-weight:800}
h1{font-size:clamp(27px,4vw,34px);line-height:1.15;letter-spacing:-.7px;margin:7px 0}
p{color:#627789;line-height:1.5;margin:7px 0 14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
label{display:block;min-width:0;font-size:12px;font-weight:750;color:#35536a;margin:10px 0}
input,select,textarea{display:block;width:100%;min-width:0;margin-top:6px;border:1px solid #cbdbe5;border-radius:10px;padding:10px 11px;font:inherit;font-size:16px;background:#fff;color:#12304a;min-height:46px}
input:focus,select:focus,textarea:focus{outline:0;border-color:#0a84e8;box-shadow:0 0 0 3px rgba(10,132,232,.12)}
textarea{min-height:88px;resize:vertical}
.btn{border:0;border-radius:11px;padding:12px 18px;background:#0a84e8;color:#fff;font:inherit;font-size:15px;font-weight:800;cursor:pointer;width:100%;min-height:48px;margin-top:8px}
.btn:disabled{opacity:.6;cursor:wait}
.msg{display:none;margin-top:12px;border-radius:12px;padding:12px;line-height:1.45}
.msg.error{display:block;background:#fff2f0;color:#9a2d22}
.msg.success{display:block;background:#e9faf7;color:#075f56}
.note{font-size:11px;color:#6b7e8e;line-height:1.4}
.back{display:inline-block;margin:0 0 12px;text-decoration:none;font-weight:700}
.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
#phone-error{display:block;margin-top:4px}
.service-field{margin:10px 0 14px}
.service-field>label{display:block;font-size:12px;font-weight:750;color:#35536a;margin:10px 0 6px}
.service-picker{position:relative}
.service-native{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}
.service-trigger{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:56px;margin:0;padding:13px 15px;border:1px solid #cbdbe5;border-radius:12px;background:#fff;color:#12304a;font:inherit;font-size:15px;font-weight:650;text-align:left;cursor:pointer;transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}
.service-trigger.is-placeholder{color:#718395;font-weight:500}
.service-trigger:hover{border-color:#77bfc4;background:#fbfefe}
.service-trigger:focus-visible,.service-option:focus-visible,.service-menu-close:focus-visible{outline:3px solid rgba(10,132,232,.28);outline-offset:2px;border-color:#0a84e8}
.service-trigger-icon{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:#eaf8f8;color:#087e83;font-size:20px;line-height:1;transition:transform .16s ease}
.service-picker.is-open .service-trigger-icon{transform:rotate(180deg)}
.service-menu{position:absolute;z-index:41;top:calc(100% + 8px);left:0;right:0;display:flex;flex-direction:column;gap:11px;padding:15px;background:#fff;border:1px solid #dce9ef;border-radius:16px;box-shadow:0 18px 48px rgba(18,48,74,.18);max-height:min(64vh,520px)}
.service-menu[hidden],.service-trigger[hidden]{display:none!important}
.service-menu-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.service-menu-heading h2{margin:0;color:#12304a;font-size:17px;line-height:1.25}
.service-menu-heading p{margin:4px 0 0;font-size:12px;color:#718395}
.service-menu-close{flex:none;width:32px;height:32px;border:0;border-radius:50%;background:#f1f7fa;color:#35536a;font:inherit;font-size:22px;line-height:1;cursor:pointer}
.service-search{width:100%;min-height:44px;margin:0;padding:10px 12px;border:1px solid #cbdbe5;border-radius:10px;background:#fbfdfe;color:#12304a;font:inherit;font-size:14px}
.service-search:focus{outline:0;border-color:#0a84e8;box-shadow:0 0 0 3px rgba(10,132,232,.12)}
.service-options{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;overscroll-behavior:contain;padding:1px 3px 3px 1px}
.service-group{display:flex;flex-direction:column;gap:5px}
.service-group-title{margin:2px 0 3px;padding:3px 7px;color:#078c98;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.service-option{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:44px;padding:10px 12px;border:1px solid transparent;border-radius:10px;background:#f7fbfd;color:#25435a;font:inherit;font-size:13px;line-height:1.35;text-align:left;cursor:pointer;transition:background .14s ease,border-color .14s ease,color .14s ease}
.service-option:hover{background:#eef8fa;border-color:#d4ebee}
.service-option[aria-selected="true"]{background:#e8f8f6;border-color:#78d1ca;color:#075f56;font-weight:750}
.service-option-mark{display:grid;place-items:center;flex:none;width:21px;height:21px;border:1.5px solid #b7cbd4;border-radius:50%;color:transparent;font-size:12px;font-weight:800}
.service-option[aria-selected="true"] .service-option-mark{border-color:#078c98;background:#078c98;color:#fff}
.service-no-results{margin:4px 6px;color:#718395;font-size:13px}
.service-error{display:block;min-height:0;margin:4px 0 0;color:#a33a32;font-size:11px;line-height:1.35}
.service-error:empty{display:none}
@media(max-width:520px){
  .service-field{margin:7px 0 10px}
  .service-field>label{font-size:11px;margin:6px 0}
  .service-trigger{min-height:46px;padding:9px 11px;border-radius:9px;font-size:14px}
  .service-trigger-icon{width:25px;height:25px;font-size:18px}
  .service-picker.is-open::before{content:"";position:fixed;inset:0;z-index:40;background:rgba(18,48,74,.32)}
  .service-menu{position:fixed;top:auto;left:10px;right:10px;bottom:10px;max-height:min(78dvh,680px);padding:16px;border-radius:20px;gap:10px}
  .service-menu-heading h2{font-size:18px}
  .service-options{max-height:calc(78dvh - 170px);gap:9px}
  .service-option{min-height:43px;padding:9px 11px;font-size:13px}
}
@media(prefers-reduced-motion:reduce){
  .service-trigger,.service-trigger-icon,.service-option{transition:none}
}
@media(max-width:520px){
  header{height:78px;padding:0 14px}
  header img{width:88px}
  .pill{padding:7px 11px;font-size:12px}
  .wrap{width:100%;margin:8px auto 10px;padding:0 10px}
  .panel{padding:14px 13px;border-radius:15px;box-shadow:0 8px 24px rgba(12,59,130,.055)}
  .eyebrow{font-size:10px;letter-spacing:.11em}
  h1{font-size:24px;line-height:1.1;margin:4px 0}
  p{font-size:12px;line-height:1.3;margin:4px 0 7px}
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
  label{font-size:11px;margin:6px 0}
  input,select{min-height:44px;padding:8px 8px;font-size:16px;border-radius:9px}
  .btn{min-height:46px;margin-top:5px;padding:10px 14px;font-size:14px}
  .note{font-size:10px;line-height:1.25;margin:5px 0}
  .msg{font-size:13px;padding:10px;margin-top:9px}
}
@media(max-width:350px){
  .panel{padding:14px 11px}
  .grid{gap:7px}
  input,select{padding-left:7px;padding-right:7px}
  h1{font-size:23px}
}
@media(min-width:900px){.wrap{margin-top:32px}.panel{padding:28px 34px}}
</style>
</head>
<body>
<header><img src="/oralyn-logo-approved.webp" alt="Oralyn"><a class="pill" href="/patient/home/">Patient home</a></header>
<main class="wrap">
<section class="panel">
<div class="eyebrow">Dr Pranali Dental Clinic · Taloja</div>
<h1>Request an appointment</h1>
<p>No account or OTP required.</p>
<form id="booking">
<div class="grid">
<label>Full name *<input name="name" autocomplete="name" minlength="2" maxlength="200" required placeholder="Your name"></label>
<label>Mobile number *<input name="phone" id="phone" type="tel" inputmode="tel" autocomplete="tel" minlength="10" maxlength="15" required aria-describedby="phone-error" placeholder="10-digit mobile"><small id="phone-error" class="note" role="status" aria-live="polite"></small></label>
</div>
<div class="service-field">
<label id="service-field-label" for="treatment-type">Dental service *</label>
<div class="service-picker" id="service-picker">
<select class="service-native" name="treatment_type" id="treatment-type" required>
<option value="" disabled selected>Choose a dental service</option>
<optgroup label="General"><option value="Dental Check-up &amp; Consultation">Dental Check-up &amp; Consultation</option><option value="Gum Treatment (Periodontal Care)">Gum Treatment (Periodontal Care)</option><option value="Tooth Sensitivity Treatment">Tooth Sensitivity Treatment</option><option value="TMJ &amp; Jaw Pain Treatment">TMJ &amp; Jaw Pain Treatment</option></optgroup>
<optgroup label="Preventive"><option value="Scaling &amp; Cleaning">Scaling &amp; Cleaning</option><option value="Dental Sealants (Cavity Prevention)">Dental Sealants (Cavity Prevention)</option><option value="Oral Hygiene Education">Oral Hygiene Education</option></optgroup>
<optgroup label="Cosmetic"><option value="Teeth Whitening">Teeth Whitening</option><option value="Veneers (Smile Makeover)">Veneers (Smile Makeover)</option><option value="Smile Makeover (Cosmetic Dentistry)">Smile Makeover (Cosmetic Dentistry)</option></optgroup>
<optgroup label="Restorative"><option value="Tooth Filling">Tooth Filling</option><option value="Root Canal Treatment (RCT)">Root Canal Treatment (RCT)</option><option value="Dental Crowns &amp; Caps">Dental Crowns &amp; Caps</option><option value="Dentures (Full / Partial)">Dentures (Full / Partial)</option></optgroup>
<optgroup label="Surgical"><option value="Dental Implants">Dental Implants</option><option value="Tooth Extraction">Tooth Extraction</option></optgroup>
<optgroup label="Orthodontic"><option value="Braces Treatment">Braces Treatment</option><option value="Clear Aligners (Invisible Braces)">Clear Aligners (Invisible Braces)</option></optgroup>
<optgroup label="Pediatric"><option value="Kids Dentistry (Child Care)">Kids Dentistry (Child Care)</option></optgroup>
<optgroup label="Emergency"><option value="Emergency Dental Care">Emergency Dental Care</option></optgroup>
<option value="Other dental concern">Other dental concern (not listed)</option>
</select>
<button class="service-trigger" id="service-trigger" type="button" hidden aria-labelledby="service-field-label service-trigger-value" aria-haspopup="listbox" aria-expanded="false" aria-controls="service-options" aria-describedby="service-error">
  <span class="service-trigger-value" id="service-trigger-value">Choose a dental service</span>
  <span class="service-trigger-icon" aria-hidden="true">⌄</span>
</button>
<div class="service-menu" id="service-menu" hidden>
  <div class="service-menu-heading">
    <div><h2 id="service-menu-title">Choose a dental service</h2><p>Select the treatment you would like to discuss</p></div>
    <button class="service-menu-close" id="service-menu-close" type="button" aria-label="Close service list">×</button>
  </div>
  <input class="service-search" id="service-search" type="search" aria-label="Search dental services" placeholder="Search services" autocomplete="off">
  <div class="service-options" id="service-options" role="listbox" aria-labelledby="service-menu-title" aria-required="true"></div>
</div>
</div>
<small class="service-error" id="service-error" role="status" aria-live="polite"></small>
</div>
<div class="grid">
<label>Preferred date *<input name="date" id="date" type="date" required></label>
<label>Preferred time (IST) *<select name="time" id="time" required><option value="">Choose a time</option><option>10:00</option><option>11:00</option><option>12:00</option><option>13:00</option><option>17:00</option><option>18:00</option><option>19:00</option><option>20:00</option></select></label>
</div>
<p class="note"><strong>Times shown in IST (Asia/Kolkata).</strong></p>
<label class="hp" aria-hidden="true">Leave this field empty<input name="website" tabindex="-1" autocomplete="off"></label>
<button class="btn" id="submit" type="submit">Send appointment request</button>
<div id="message" class="msg" role="status" aria-live="polite"></div>
<p class="note"><strong>Request only.</strong> Contact details are used only to respond.</p>
</form>
</section>
</main>
<script>
window.__oralynBookingScriptStage = "started";
const API_BASE = (() => {
  const configured = document.querySelector('meta[name="oralyn-api-origin"]')?.content?.trim() || "";
  try {
    const parsed = new URL(configured);
    if (parsed.protocol !== "https:" || parsed.origin !== configured || parsed.username || parsed.password) return "";
    return parsed.origin;
  } catch {
    return "";
  }
})();
const form = document.getElementById("booking");
const message = document.getElementById("message");
const dateInput = document.getElementById("date");
const phoneInput = document.getElementById("phone");
const timeInput = document.getElementById("time");
const phoneError = document.getElementById("phone-error");
const serviceSelect = document.getElementById("treatment-type");
const serviceById = {"checkup":"Dental Check-up & Consultation","scaling":"Scaling & Cleaning","whitening":"Teeth Whitening","filling":"Tooth Filling","rct":"Root Canal Treatment (RCT)","crowns":"Dental Crowns & Caps","implants":"Dental Implants","extraction":"Tooth Extraction","braces":"Braces Treatment","aligners":"Clear Aligners (Invisible Braces)","dentures":"Dentures (Full / Partial)","veneers":"Veneers (Smile Makeover)","gum-care":"Gum Treatment (Periodontal Care)","kids":"Kids Dentistry (Child Care)","emergency":"Emergency Dental Care","sensitivity":"Tooth Sensitivity Treatment","sealants":"Dental Sealants (Cavity Prevention)","hygiene":"Oral Hygiene Education","smile-makeover":"Smile Makeover (Cosmetic Dentistry)","tmj":"TMJ & Jaw Pain Treatment"};
const requestedService = new URLSearchParams(window.location.search).get("service");
if (requestedService && serviceById[requestedService]) serviceSelect.value = serviceById[requestedService];
const servicePicker = document.getElementById("service-picker");
const serviceTrigger = document.getElementById("service-trigger");
const serviceTriggerValue = document.getElementById("service-trigger-value");
const serviceMenu = document.getElementById("service-menu");
const serviceMenuClose = document.getElementById("service-menu-close");
const serviceSearchInput = document.getElementById("service-search");
const serviceOptionsContainer = document.getElementById("service-options");
const serviceError = document.getElementById("service-error");
let serviceOptionButtons = [];
const serviceGroups = Array.from(serviceSelect.children).flatMap((child) => {
  if (child.tagName === "OPTGROUP") return [{ label: child.label, options: Array.from(child.children).filter((option) => option.tagName === "OPTION") }];
  if (child.tagName === "OPTION" && child.value) return [{ label: "Other", options: [child] }];
  return [];
});
function renderServiceOptions(searchTerm = "") {
  const query = String(searchTerm).trim().toLocaleLowerCase("en-IN");
  const fragment = document.createDocumentFragment();
  serviceOptionButtons = [];
  serviceGroups.forEach((group, groupIndex) => {
    const options = group.options.filter((option) =>
      !query || group.label.toLocaleLowerCase("en-IN").includes(query) ||
      option.textContent.trim().toLocaleLowerCase("en-IN").includes(query)
    );
    if (!options.length) return;
    const section = document.createElement("section");
    section.className = "service-group";
    section.setAttribute("role", "group");
    section.setAttribute("aria-label", group.label);
    const heading = document.createElement("h3");
    heading.className = "service-group-title";
    heading.id = "service-group-title-" + groupIndex;
    heading.textContent = group.label;
    section.setAttribute("aria-labelledby", heading.id);
    section.append(heading);
    options.forEach((option) => {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "service-option";
      item.setAttribute("role", "option");
      item.setAttribute("aria-selected", String(option.value === serviceSelect.value));
      item.dataset.serviceValue = option.value;
      const name = document.createElement("span");
      name.className = "service-option-name";
      name.textContent = option.textContent.trim();
      const mark = document.createElement("span");
      mark.className = "service-option-mark";
      mark.setAttribute("aria-hidden", "true");
      mark.textContent = option.value === serviceSelect.value ? "✓" : "";
      item.append(name, mark);
      section.append(item);
      serviceOptionButtons.push(item);
    });
    fragment.append(section);
  });
  serviceOptionsContainer.replaceChildren(fragment);
  if (!serviceOptionButtons.length) {
    const empty = document.createElement("p");
    empty.className = "service-no-results";
    empty.textContent = "No matching services. Try another search.";
    serviceOptionsContainer.append(empty);
  }
}
function syncServicePicker() {
  const selected = serviceSelect.selectedOptions[0];
  const hasValue = Boolean(selected && selected.value);
  serviceTriggerValue.textContent = hasValue ? selected.textContent.trim() : "Choose a dental service";
  serviceTrigger.classList.toggle("is-placeholder", !hasValue);
  if (!serviceMenu.hidden) renderServiceOptions(serviceSearchInput.value);
}
function openServiceMenu() {
  serviceMenu.hidden = false;
  servicePicker.classList.add("is-open");
  serviceTrigger.setAttribute("aria-expanded", "true");
  serviceSearchInput.value = "";
  renderServiceOptions();
  const selected = serviceOptionButtons.find((item) => item.dataset.serviceValue === serviceSelect.value);
  (selected || serviceOptionButtons[0])?.focus();
}
function closeServiceMenu(restoreFocus = true) {
  if (serviceMenu.hidden) return;
  serviceMenu.hidden = true;
  servicePicker.classList.remove("is-open");
  serviceTrigger.setAttribute("aria-expanded", "false");
  if (restoreFocus) serviceTrigger.focus();
}
function chooseService(value) {
  const option = Array.from(serviceSelect.options).find((item) => item.value === value);
  if (!option) return;
  serviceSelect.value = value;
  serviceSelect.dispatchEvent(new Event("change", { bubbles: true }));
  serviceError.textContent = "";
  serviceError.classList.remove("visible");
  serviceTrigger.removeAttribute("aria-invalid");
  closeServiceMenu();
}
serviceSelect.hidden = true;
serviceSelect.removeAttribute("required");
serviceSelect.setAttribute("aria-hidden", "true");
serviceSelect.tabIndex = -1;
serviceTrigger.hidden = false;
servicePicker.classList.add("is-enhanced");
syncServicePicker();
window.__oralynBookingScriptStage = "service-picker-ready";
serviceSelect.addEventListener("change", syncServicePicker);
serviceTrigger.addEventListener("click", () => {
  if (serviceMenu.hidden) openServiceMenu();
  else closeServiceMenu();
});
serviceTrigger.addEventListener("keydown", (event) => {
  if (event.key === "ArrowDown" || event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    if (serviceMenu.hidden) openServiceMenu();
  }
});
serviceOptionsContainer.addEventListener("click", (event) => {
  const item = event.target.closest("button[data-service-value]");
  if (item) chooseService(item.dataset.serviceValue);
});
serviceOptionsContainer.addEventListener("keydown", (event) => {
  const index = serviceOptionButtons.indexOf(document.activeElement);
  let nextIndex = index;
  if (event.key === "ArrowDown") nextIndex = Math.min(serviceOptionButtons.length - 1, index + 1);
  else if (event.key === "ArrowUp") nextIndex = Math.max(0, index - 1);
  else if (event.key === "Home") nextIndex = 0;
  else if (event.key === "End") nextIndex = serviceOptionButtons.length - 1;
  else if (event.key === "Escape") {
    event.preventDefault();
    closeServiceMenu();
    return;
  } else return;
  event.preventDefault();
  serviceOptionButtons[nextIndex]?.focus();
});
serviceSearchInput.addEventListener("input", () => renderServiceOptions(serviceSearchInput.value));
serviceSearchInput.addEventListener("keydown", (event) => {
  if (event.key === "ArrowDown") {
    event.preventDefault();
    serviceOptionButtons[0]?.focus();
  } else if (event.key === "Escape") {
    event.preventDefault();
    closeServiceMenu();
  }
});
serviceMenuClose.addEventListener("click", () => closeServiceMenu());
servicePicker.addEventListener("click", (event) => {
  if (event.target === servicePicker && servicePicker.classList.contains("is-open")) closeServiceMenu(false);
});
document.addEventListener("pointerdown", (event) => {
  if (!servicePicker.contains(event.target)) closeServiceMenu(false);
});
servicePicker.addEventListener("focusout", (event) => {
  if (!servicePicker.contains(event.relatedTarget)) closeServiceMenu(false);
});
const idempotencyStorageKey = "oralyn_public_booking_idempotency";
const pendingStorageKey = "oralyn_public_booking_pending";
const newIdempotencyKey = () => {
  if (typeof crypto === "undefined" || typeof crypto.getRandomValues !== "function") {
    throw new Error("Secure browser storage is required to send an appointment request.");
  }
  if (typeof crypto.randomUUID === "function") return crypto.randomUUID();
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, (value) => value.toString(16).padStart(2, "0")).join("");
};
let idempotencyKey = newIdempotencyKey();
let requestPending = false;
try {
  idempotencyKey = sessionStorage.getItem(idempotencyStorageKey) || idempotencyKey;
  sessionStorage.setItem(idempotencyStorageKey, idempotencyKey);
  requestPending = sessionStorage.getItem(pendingStorageKey) === "1";
} catch {}
const rotateIdempotencyKey = () => {
  idempotencyKey = newIdempotencyKey();
  requestPending = false;
  try {
    sessionStorage.setItem(idempotencyStorageKey, idempotencyKey);
    sessionStorage.removeItem(pendingStorageKey);
  } catch {}
};
const clearValidationMessage = () => {
  if (message.classList.contains("error")) {
    message.className = "msg";
    message.textContent = "";
  }
  if (serviceError.textContent) serviceError.textContent = "";
  serviceError.classList.remove("visible");
  serviceTrigger.removeAttribute("aria-invalid");
};
form.addEventListener("invalid", (event) => {
  message.className = "msg error";
  message.textContent = "Please complete all required fields and correct any highlighted details before sending your request.";
  if (event.target === serviceSelect) {
    event.preventDefault();
    serviceError.textContent = "Please choose a dental service.";
    if (event.isTrusted) openServiceMenu();
    else serviceTrigger.focus();
  }
}, true);
form.addEventListener("input", () => {
  if (requestPending) rotateIdempotencyKey();
  clearValidationMessage();
});
form.addEventListener("change", () => {
  if (requestPending) rotateIdempotencyKey();
  clearValidationMessage();
});
const today = new Date();
const clinicParts = new Intl.DateTimeFormat("en-GB", {timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(today);
const clinicPart = (type) => clinicParts.find((part) => part.type === type)?.value || "";
const localToday = clinicPart("year") + "-" + clinicPart("month") + "-" + clinicPart("day");
dateInput.min = localToday;
dateInput.setAttribute("min", localToday);
dateInput.value = localToday;
window.__oralynBookingScriptStage = "date-ready";
dateInput.addEventListener("change", () => {
  dateInput.setCustomValidity(dateInput.value && dateInput.value < localToday
    ? "Please choose today or a future date." : "");
});
const validateIndianMobile = () => {
  const raw = phoneInput.value.trim();
  const digits = raw.replace(/\D/g, "");
  const valid = !raw || /^[6-9][0-9]{9}$/.test(digits)
    || /^91[6-9][0-9]{9}$/.test(digits);
  phoneInput.setCustomValidity(valid ? "" : "Enter a valid 10-digit Indian mobile number.");
  phoneError.textContent = raw && !valid
    ? "Enter a valid 10-digit Indian mobile number (or +91 followed by 10 digits)." : "";
  return valid;
};
phoneInput.addEventListener("input", validateIndianMobile);
phoneInput.addEventListener("blur", validateIndianMobile);
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.className = "msg";
  message.textContent = "";
  if (!serviceSelect.value) {
    serviceError.textContent = "Please choose a dental service.";
    serviceError.classList.add("visible");
    serviceTrigger.setAttribute("aria-invalid", "true");
    serviceTrigger.focus();
    message.className = "msg error";
    message.textContent = "Please choose a dental service before sending your request.";
    return;
  }
  if (!form.reportValidity()) return;
  if (!API_BASE) {
    message.className = "msg error";
    message.textContent = "Appointment requests are temporarily unavailable. Please call the clinic.";
    return;
  }
  const data = new FormData(form);
  if (String(data.get("website") || "").trim()) return;
  if (!validateIndianMobile()) {
    phoneInput.reportValidity();
    return;
  }
  const localDateTime = String(data.get("date")) + "T" + String(data.get("time")) + ":00";
  const startsAt = new Date(localDateTime + "+05:30");
  if (Number.isNaN(startsAt.getTime()) || startsAt <= new Date()) {
    message.className = "msg error";
    message.textContent = "Please choose a future date and time.";
    return;
  }
  const button = document.getElementById("submit");
  requestPending = true;
  try { sessionStorage.setItem(pendingStorageKey, "1"); } catch {}
  button.disabled = true;
  button.textContent = "Sending request…";
  try {
    const response = await fetch(API_BASE + "/v1/dental/public/appointments", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        idempotency_key: idempotencyKey,
        name: String(data.get("name")).trim(),
        phone: String(data.get("phone")).trim(),
        starts_at: localDateTime + "+05:30",
        treatment_type: String(data.get("treatment_type")),
        intelligence_request: false,
        website: String(data.get("website") || "").trim()
      })
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      const serverMessage = typeof result.detail === "string"
        ? result.detail
        : typeof result.detail?.message === "string" ? result.detail.message : "";
      const detail = response.status === 429
        ? "Too many requests. Please wait a few minutes and try again."
        : response.status === 422
          ? "Please check your details, choose a published service and select a future IST time."
          : serverMessage || "We could not send your request. Please call the clinic.";
      throw new Error(detail);
    }
    form.reset();
    syncServicePicker();
    dateInput.value = localToday;
    rotateIdempotencyKey();
    message.className = "msg success";
    message.textContent = result.status === "already_received"
      ? (result.message || "A similar request was already received. The clinic will contact you to confirm.")
      : `${result.message || "Your appointment request has been received."}${result.reference ? " Reference: " + result.reference + "." : ""}`;
  } catch (error) {
    message.className = "msg error";
    message.textContent = error.message || "Network error. Please try again or call the clinic.";
  } finally {
    button.disabled = false;
    button.textContent = "Send appointment request";
  }
});
</script>
</body></html>
