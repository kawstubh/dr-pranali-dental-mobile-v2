<style>
@font-face{font-family:'Plus Jakarta Sans';src:url('/fonts/PlusJakartaSans-Variable.ttf') format('truetype');font-style:normal;font-weight:200 800;font-display:swap}
@font-face{font-family:'Playfair Display';src:url('/fonts/PlayfairDisplay-Variable.ttf') format('truetype');font-style:normal;font-weight:400 900;font-display:swap}
:root{font-family:'Plus Jakarta Sans',Arial,sans-serif;color:#12304a;background:#f3f9fc;color-scheme:light}
*{box-sizing:border-box}
html{min-height:100%;background:radial-gradient(ellipse at 12% 8%,rgba(0,198,200,.11),transparent 34%),radial-gradient(ellipse at 88% 28%,rgba(10,132,232,.09),transparent 32%),#f3f9fc}
body{margin:0;min-height:100vh}
header{height:82px;background:rgba(255,255,255,.94);border-bottom:1px solid #e4edf2;padding:0 max(22px,calc((100vw - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;backdrop-filter:blur(14px)}
header img{width:124px;max-width:42vw;max-height:72px;height:auto;display:block;object-fit:contain}
a{color:#0a84e8}
.pill{border:1px solid #d7e8ed;border-radius:999px;padding:9px 15px;color:#0b7280;background:#f8fcfd;text-decoration:none;font-size:12px;font-weight:750;white-space:nowrap;transition:background .18s ease,border-color .18s ease}
.pill:hover{background:#eaf8f8;border-color:#a9d9da}
.wrap{width:min(100% - 36px,660px);margin:30px auto 42px}
.panel{position:relative;overflow:visible;background:#fff;border:1px solid #e1ebf0;border-radius:24px;padding:30px 34px;box-shadow:0 24px 70px rgba(12,59,130,.085)}
.panel:before{content:"";position:absolute;top:-1px;left:30px;right:30px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#00c6c8,#0a84e8)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#078c98;font-weight:800}
.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:#00b7b9;box-shadow:0 0 0 4px #e6f8f7}
h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(30px,4vw,38px);line-height:1.08;letter-spacing:-.55px;color:#12304a;margin:12px 0 5px;font-weight:700}
p{color:#687f90;line-height:1.45;margin:5px 0 18px;font-size:13px}
form{margin-top:18px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
label{display:block;min-width:0;font-size:12px;font-weight:750;color:#35536a;margin:9px 0 12px}
input,select,textarea{display:block;width:100%;min-width:0;margin-top:7px;border:1px solid #d5e1e8;border-radius:11px;padding:11px 12px;font:inherit;font-size:16px;background:#fbfdfe;color:#12304a;min-height:48px;transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}
input::placeholder{color:#94a5b1}
input:hover,select:hover,textarea:hover{border-color:#a9cbd4;background:#fff}
input:focus,select:focus,textarea:focus{outline:0;border-color:#0a84e8;background:#fff;box-shadow:0 0 0 3px rgba(10,132,232,.13)}
textarea{min-height:88px;resize:vertical}
.btn{border:0;border-radius:12px;padding:13px 18px;background:linear-gradient(105deg,#087fbd,#0a84e8);color:#fff;font:inherit;font-size:14px;font-weight:800;letter-spacing:.01em;cursor:pointer;width:100%;min-height:50px;margin-top:9px;box-shadow:0 8px 18px rgba(10,132,232,.2);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
.btn:hover{filter:brightness(1.04);box-shadow:0 11px 22px rgba(10,132,232,.25);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:3px solid rgba(10,132,232,.32);outline-offset:3px}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.msg{display:none;margin-top:12px;border-radius:12px;padding:12px;line-height:1.45;font-size:13px}
.msg.error{display:block;background:#fff2f0;color:#9a2d22;border:1px solid #f4d4cf}
.msg.success{display:block;background:#e9faf7;color:#075f56;border:1px solid #c8eee7}
.note{font-size:11px;color:#718596;line-height:1.4}
.back{display:inline-block;margin:0 0 12px;text-decoration:none;font-weight:700}
.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
#phone-error{display:block;margin-top:4px}
.service-field{margin:8px 0 13px}
.service-field>label{display:block;font-size:12px;font-weight:750;color:#35536a;margin:8px 0 6px}
.service-error{display:block;min-height:0;margin:4px 0 0;color:#a33a32;font-size:11px;line-height:1.35}.service-error:empty{display:none}

  header{height:66px;padding:0 14px}
  header img{width:96px;max-height:60px}
  .pill{padding:7px 11px;font-size:11px}
  .wrap{width:100%;margin:9px auto 12px;padding:0 10px}
  .panel{padding:16px 14px 15px;border-radius:17px;box-shadow:0 9px 28px rgba(12,59,130,.065)}
  .panel:before{left:18px;right:18px}
  .eyebrow{font-size:9px;letter-spacing:.12em}
  h1{font-size:27px;line-height:1.08;margin:8px 0 4px}
  p{font-size:12px;line-height:1.35;margin:4px 0 9px}
  form{margin-top:12px}
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
  label{font-size:11px;margin:5px 0 8px}
  input,select{min-height:45px;padding:9px 9px;font-size:16px;border-radius:10px}
  .service-field{margin:5px 0 8px}
  .service-field>label{font-size:11px;margin:5px 0}
  .btn{min-height:47px;margin-top:6px;padding:10px 14px;font-size:14px}
  .note{font-size:10px;line-height:1.3;margin:5px 0}
  .msg{font-size:13px;padding:10px;margin-top:9px}
}
@media(max-width:350px){
  .panel{padding:14px 11px}
  .grid{gap:7px}
  input,select{padding-left:7px;padding-right:7px}
  h1{font-size:25px}
}
@media(min-width:900px){.wrap{margin-top:38px}.panel{padding:34px 38px}}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
/* Accessible page flow: content can grow and scroll instead of being clipped. */
html,body{width:100%;height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{height:76px;min-height:76px;flex:0 0 76px;padding:0 max(22px,calc((100vw - 1080px)/2))}
.wrap{width:min(100% - 36px,720px);height:auto;min-height:calc(100dvh - 76px);margin:0 auto;padding:42px 0 56px;display:flex;align-items:flex-start;justify-content:center}
.panel{width:100%;max-height:none;overflow:visible;padding:34px 38px;border-radius:22px}
.panel:before{left:28px;right:28px}
h1{font-size:clamp(30px,3.3vw,38px);margin:10px 0 5px}
p{font-size:13px;line-height:1.55;margin:5px 0 16px}
form{margin-top:18px}
.grid{gap:14px}
label{font-size:12px;margin:8px 0 12px}
input,select{min-height:48px;padding:11px 12px;font-size:16px;margin-top:7px}
.service-field{margin:8px 0 13px}
.service-field>label{margin:8px 0 6px;font-size:12px}
.btn{min-height:50px;margin-top:9px;padding:13px 18px;font-size:14px}
.note{font-size:11px;line-height:1.4;margin:6px 0}
.msg{font-size:13px;padding:12px;margin-top:12px}
@media(max-width:760px){
 header{height:68px;min-height:68px;flex-basis:68px;padding:0 16px}
 header .clinic-wordmark strong{font-size:15px}
 header .clinic-wordmark span{font-size:10px}
 .wrap{width:100%;min-height:calc(100dvh - 68px);padding:24px 14px 36px}
 .panel{padding:24px 20px;border-radius:18px}
 .eyebrow{font-size:9px;letter-spacing:.11em}
 h1{font-size:clamp(27px,6vw,34px);line-height:1.12}
 p{font-size:12px;line-height:1.5}
 .grid{gap:10px}
 label{font-size:11px;margin:7px 0 9px}
 input,select{min-height:46px;padding:10px;font-size:16px}
 .btn{min-height:48px;font-size:14px}
}
@media(max-width:520px){
 .wrap{padding:16px 12px 28px}
 .panel{padding:22px 16px}
 .grid{grid-template-columns:minmax(0,1fr);gap:0}
 label{margin:6px 0 8px}
 .service-field{margin:6px 0 9px}
 .btn{margin-top:8px}
}
@media(max-height:620px) and (min-width:761px){
 .wrap{padding-top:22px;padding-bottom:30px}
}
</style>
</head>
<body>
<header><img src="/oralyn-official-logo.png" alt="Oralyn"><a class="pill" href="/patient/home/">Patient home</a></header>
<main class="wrap">
<section class="panel">
<div class="eyebrow">Dr Pranali Dental Clinic  -  Taloja</div>
<h1>Request an appointment</h1>
<p>No account or OTP is required.</p>
<form id="booking">
<div class="grid">
<label>Full name *<input name="name" autocomplete="name" minlength="2" maxlength="200" required placeholder="Your name"></label>
<label>Mobile number *<input name="phone" id="phone" type="tel" inputmode="tel" autocomplete="tel" minlength="10" maxlength="15" required aria-describedby="phone-error" placeholder="10-digit mobile"><small id="phone-error" class="note" role="status" aria-live="polite"></small></label>
</div>
<div class="service-field">
<label id="service-field-label" for="treatment-type">Dental service *</label>
<select name="treatment_type" id="treatment-type" required aria-describedby="service-error">
<option value="" disabled selected>Choose a dental service</option>
<optgroup label="General"><option value="Dental Check-up &amp; Consultation">Dental Check-up &amp; Consultation</option><option value="Gum Treatment (Periodontal Care)">Gum Treatment (Periodontal Care)</option><option value="Tooth Sensitivity Treatment">Tooth Sensitivity Treatment</option><option value="TMJ &amp; Jaw Pain Treatment">TMJ &amp; Jaw Pain Treatment</option></optgroup>
<optgroup label="Preventive"><option value="Scaling &amp; Cleaning">Scaling &amp; Cleaning</option><option value="Dental Sealants">Dental Sealants</option><option value="Oral Hygiene Education">Oral Hygiene Education</option></optgroup>
<optgroup label="Cosmetic"><option value="Teeth Whitening">Teeth Whitening</option><option value="Veneers">Veneers</option><option value="Smile Makeover">Smile Makeover</option></optgroup>
<optgroup label="Restorative"><option value="Tooth Filling">Tooth Filling</option><option value="Root Canal Treatment">Root Canal Treatment</option><option value="Dental Crowns &amp; Caps">Dental Crowns &amp; Caps</option><option value="Dentures">Dentures</option></optgroup>
<optgroup label="Surgical"><option value="Dental Implants">Dental Implants</option><option value="Tooth Extraction">Tooth Extraction</option></optgroup>
<optgroup label="Orthodontic"><option value="Braces Treatment">Braces Treatment</option><option value="Clear Aligners">Clear Aligners</option></optgroup>
<optgroup label="Pediatric"><option value="Kids Dentistry">Kids Dentistry</option></optgroup>
<optgroup label="Emergency"><option value="Emergency Dental Care">Emergency Dental Care</option></optgroup>
<option value="Other dental concern">Other dental concern (not listed)</option>
</select>
<small class="service-error" id="service-error" role="status" aria-live="polite"></small>
</div><div class="grid">
<label>Preferred date *<input name="date" id="date" type="date" required></label>
<label>Preferred time (IST) *<select name="time" id="time" required><option value="">Choose a time</option><option>10:00</option><option>11:00</option><option>12:00</option><option>13:00</option><option>17:00</option><option>18:00</option><option>19:00</option><option>20:00</option></select></label>
</div>
<p class="note"><strong>All appointment times are shown in India Standard Time (IST, Asia/Kolkata, UTC+05:30).</strong></p>
<label class="hp" aria-hidden="true">Leave this field empty<input name="website" tabindex="-1" autocomplete="off"></label>
<button class="btn" id="submit" type="submit">Send appointment request</button>
<div id="message" class="msg" role="status" aria-live="polite"></div>
<p class="note"><strong>Request only.</strong> Contact details are used only to respond.</p>
</form>
</section>
</main>
<script>
window.__oralynBookingScriptStage = "started";
const API_BASE = (() => {
  const configured = document.querySelector('meta[name="oralyn-api-origin"]')?.content?.trim() || "";
  try {
    const parsed = new URL(configured);
    if (parsed.protocol !== "https:" || parsed.origin !== configured || parsed.username || parsed.password) return "";
    return parsed.origin;
  } catch {
    return "";
  }
})();
const form = document.getElementById("booking");
const message = document.getElementById("message");
const dateInput = document.getElementById("date");
const phoneInput = document.getElementById("phone");
const timeInput = document.getElementById("time");
const phoneError = document.getElementById("phone-error");
const serviceSelect = document.getElementById("treatment-type");
const serviceById = {"checkup":"Dental Check-up & Consultation","scaling":"Scaling & Cleaning","whitening":"Teeth Whitening","filling":"Tooth Filling","rct":"Root Canal Treatment","crowns":"Dental Crowns & Caps","implants":"Dental Implants","extraction":"Tooth Extraction","braces":"Braces Treatment","aligners":"Clear Aligners","dentures":"Dentures","veneers":"Veneers","gum-care":"Gum Treatment (Periodontal Care)","kids":"Kids Dentistry","emergency":"Emergency Dental Care","sensitivity":"Tooth Sensitivity Treatment","sealants":"Dental Sealants","hygiene":"Oral Hygiene Education","smile-makeover":"Smile Makeover","tmj":"TMJ & Jaw Pain Treatment","other":"Other dental concern"};
const requestedService = new URLSearchParams(window.location.search).get("service");
if (requestedService && serviceById[requestedService]) serviceSelect.value = serviceById[requestedService];
const serviceError = document.getElementById("service-error");
serviceSelect.addEventListener("change", () => { serviceError.textContent = ""; serviceSelect.removeAttribute("aria-invalid"); });
const idempotencyStorageKey = "oralyn_public_booking_idempotency";
const pendingStorageKey = "oralyn_public_booking_pending";
const newIdempotencyKey = () => {
  if (typeof crypto === "undefined" || typeof crypto.getRandomValues !== "function") {
    throw new Error("Secure browser storage is required to send an appointment request.");
  }
  if (typeof crypto.randomUUID === "function") return crypto.randomUUID();
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, (value) => value.toString(16).padStart(2, "0")).join("");
};
let idempotencyKey = newIdempotencyKey();
let requestPending = false;
let idempotencyStorageReady = false;
let pendingFromPreviousPage = false;
try {
  idempotencyKey = sessionStorage.getItem(idempotencyStorageKey) || idempotencyKey;
  sessionStorage.setItem(idempotencyStorageKey, idempotencyKey);
  idempotencyStorageReady = sessionStorage.getItem(idempotencyStorageKey) === idempotencyKey;
  requestPending = sessionStorage.getItem(pendingStorageKey) === "1";
  pendingFromPreviousPage = requestPending;
} catch {
  idempotencyStorageReady = false;
}
const rotateIdempotencyKey = () => {
  idempotencyKey = newIdempotencyKey();
  requestPending = false;
  pendingFromPreviousPage = false;
  try {
    sessionStorage.setItem(idempotencyStorageKey, idempotencyKey);
    sessionStorage.removeItem(pendingStorageKey);
    idempotencyStorageReady =
      sessionStorage.getItem(idempotencyStorageKey) === idempotencyKey &&
      sessionStorage.getItem(pendingStorageKey) === null;
  } catch {
    idempotencyStorageReady = false;
  }
};
const clearValidationMessage = () => {
  if (message.classList.contains("error")) {
    message.className = "msg";
    message.textContent = "";
  }
  if (serviceError.textContent) serviceError.textContent = "";
  serviceSelect.removeAttribute("aria-invalid");
  serviceError.classList.remove("visible");
  serviceSelect.removeAttribute("aria-invalid");
  
};
form.addEventListener("invalid", (event) => {
  message.className = "msg error";
  message.textContent = "Please complete all required fields and correct any highlighted details before sending your request.";
  if (event.target === serviceSelect) {
    event.preventDefault();
    serviceError.textContent = "Please choose a dental service.";
    
    serviceSelect.focus();
  }
}, true);
form.addEventListener("input", () => {
  if (requestPending && !pendingFromPreviousPage) rotateIdempotencyKey();
  clearValidationMessage();
});
form.addEventListener("change", () => {
  if (requestPending && !pendingFromPreviousPage) rotateIdempotencyKey();
  clearValidationMessage();
});
const today = new Date();
const clinicParts = new Intl.DateTimeFormat("en-GB", {timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(today);
const clinicPart = (type) => clinicParts.find((part) => part.type === type)?.value || "";
const localToday = clinicPart("year") + "-" + clinicPart("month") + "-" + clinicPart("day");
dateInput.min = localToday;
dateInput.setAttribute("min", localToday);
dateInput.value = localToday;
window.__oralynBookingScriptStage = "date-ready";
dateInput.addEventListener("change", () => {
  dateInput.setCustomValidity(dateInput.value && dateInput.value < localToday
    ? "Please choose today or a future date." : "");
});
const validateIndianMobile = () => {
  const raw = phoneInput.value.trim();
  const digits = raw.replace(/\D/g, "");
  const valid = !raw || /^[6-9][0-9]{9}$/.test(digits)
    || /^91[6-9][0-9]{9}$/.test(digits);
  phoneInput.setCustomValidity(valid ? "" : "Enter a valid 10-digit Indian mobile number.");
  phoneError.textContent = raw && !valid
    ? "Enter a valid 10-digit Indian mobile number (or +91 followed by 10 digits)." : "";
  return valid;
};
phoneInput.addEventListener("input", validateIndianMobile);
phoneInput.addEventListener("blur", validateIndianMobile);
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.className = "msg";
  message.textContent = "";
  if (!form.reportValidity()) return;
  if (!serviceSelect.value) {
    serviceError.textContent = "Please choose a dental service.";
    serviceError.classList.add("visible");
    serviceSelect.setAttribute("aria-invalid", "true");
    serviceSelect.focus();
    message.className = "msg error";
    message.textContent = "Please choose a dental service before sending your request.";
    return;
  }
  if (!API_BASE) {
    message.className = "msg error";
    message.textContent = "Appointment requests are temporarily unavailable. Please call the clinic.";
    return;
  }
  const data = new FormData(form);
  if (String(data.get("website") || "").trim()) return;
  if (!validateIndianMobile()) {
    phoneInput.reportValidity();
    return;
  }
  const localDateTime = String(data.get("date")) + "T" + String(data.get("time")) + ":00";
  const startsAt = new Date(localDateTime + "+05:30");
  if (Number.isNaN(startsAt.getTime()) || startsAt <= new Date()) {
    message.className = "msg error";
    message.textContent = "Please choose a future date and time.";
    return;
  }
  const button = document.getElementById("submit");
  if (!idempotencyStorageReady) {
    message.className = "msg error";
    message.textContent = "Secure browser session storage is unavailable. Enable browser storage or call the clinic to request an appointment.";
    return;
  }
  requestPending = true;
  pendingFromPreviousPage = false;
  try {
    sessionStorage.setItem(pendingStorageKey, "1");
    if (
      sessionStorage.getItem(idempotencyStorageKey) !== idempotencyKey ||
      sessionStorage.getItem(pendingStorageKey) !== "1"
    ) {
      throw new Error("Booking retry state could not be saved.");
    }
  } catch {
    idempotencyStorageReady = false;
    requestPending = false;
    message.className = "msg error";
    message.textContent = "Secure browser session storage is unavailable. Enable browser storage or call the clinic to request an appointment.";
    return;
  }
  button.disabled = true;
  button.textContent = "Sending request...";
  try {
    const response = await fetch(API_BASE + "/v1/dental/public/appointments", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        idempotency_key: idempotencyKey,
        name: String(data.get("name")).trim(),
        phone: String(data.get("phone")).trim(),
        starts_at: localDateTime + "+05:30",
        treatment_type: String(data.get("treatment_type")),
        intelligence_request: false,
        website: String(data.get("website") || "").trim()
      })
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      if (response.status === 409 && result.detail?.code === "IDEMPOTENCY_KEY_REUSED") {
        rotateIdempotencyKey();
        throw new Error("The saved request key was used with different details. A new secure key is ready; please review and send again.");
      }
      const serverMessage = typeof result.detail === "string"
        ? result.detail
        : typeof result.detail?.message === "string" ? result.detail.message : "";
      const detail = response.status === 429
        ? "Too many requests. Please wait a few minutes and try again."
        : response.status === 422
          ? "Please check your details, choose a published service and select a future IST time."
          : serverMessage || "We could not send your request. Please call the clinic.";
      throw new Error(detail);
    }
    form.reset();
    
    dateInput.value = localToday;
    rotateIdempotencyKey();
    message.className = "msg success";
    message.textContent = result.status === "already_received"
      ? (result.message || "A similar request was already received. The clinic will contact you to confirm.")
      : `${result.message || "Your appointment request has been received."}${result.reference ? " Reference: " + result.reference + "." : ""}`;
  } catch (error) {
    message.className = "msg error";
    message.textContent = error.message || "Network error. Please try again or call the clinic.";
  } finally {
    button.disabled = false;
    button.textContent = "Send appointment request";
  }
});
</script>
</body></html>
